<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ULTIMATE SURVIVAL</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    html,body{margin:0;width:100%;height:100%;background:#05070d;color:white;font-family:Arial,'맑은 고딕',sans-serif;overflow:hidden}
    body{display:flex;align-items:center;justify-content:center}
    #wrap{position:relative;width:min(100vw,450px);height:min(100vh,900px);background:#000;overflow:hidden}
    canvas{width:100%;height:100%;display:block;background:#03050b;touch-action:none}
    .screen{position:absolute;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:10;padding:18px}
    .hidden{display:none!important}
    .panel{width:100%;max-width:390px;border:2px solid #28a8ff;border-radius:18px;background:linear-gradient(180deg,rgba(7,17,36,.96),rgba(0,0,0,.96));box-shadow:0 0 22px rgba(40,168,255,.45);padding:18px;text-align:center}
    h1{margin:0 0 8px;font-size:32px;letter-spacing:2px;color:#72d5ff;text-shadow:0 0 12px #15a9ff}
    h2{margin:6px 0 14px;color:#b8ecff}
    p{line-height:1.45;color:#d8f4ff}
    button{width:100%;margin:7px 0;padding:12px 10px;border-radius:12px;border:1px solid #4bc6ff;background:#0b315d;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
    button:hover{background:#0f4d8d}
    button.danger{border-color:#ff5577;background:#60152a}
    button.gold{border-color:#ffd35a;background:#5a4100;color:#fff2b0}
    input{width:100%;margin:7px 0;padding:12px;border-radius:10px;border:1px solid #4bc6ff;background:#06101e;color:#fff;font-size:16px;outline:none}
    .msg{min-height:22px;color:#ff9aae;font-size:14px;white-space:pre-wrap}
    #pauseBtn{position:absolute;right:10px;top:10px;width:48px;height:36px;margin:0;padding:0;z-index:5;border-radius:9px;background:rgba(9,45,84,.75)}
    #cardList{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
    .cardBtn{padding:13px 10px;text-align:left;white-space:normal;min-height:78px}
    .cCommon{border-color:#56ff81;background:rgba(20,90,40,.96)}
    .cRare{border-color:#55b7ff;background:rgba(25,60,120,.96)}
    .cEpic{border-color:#b86bff;background:rgba(75,35,120,.96)}
    .cLegend{border-color:#ffd85a;background:rgba(120,86,10,.96)}
    .cPenalty{border-color:#ff4b65;background:rgba(100,15,25,.96)}
    .tiny{font-size:12px;color:#a8c7da}
    .row{display:flex;gap:8px}.row button{flex:1}
    #leader,#codex{max-height:230px;overflow:auto;text-align:left;border:1px solid rgba(100,200,255,.35);border-radius:12px;padding:9px;margin-top:8px;background:rgba(0,0,0,.28)}
    .barBox{height:10px;border:1px solid #69d8ff;border-radius:20px;overflow:hidden;margin-top:8px;background:#101724}.barFill{height:100%;background:#69d8ff;width:100%}
  </style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="450" height="900"></canvas>
  <button id="pauseBtn" class="hidden">Ⅱ</button>

  <div id="authScreen" class="screen">
    <div class="panel">
      <h1>ULTIMATE<br>SURVIVAL</h1>
      <p class="tiny">회원가입 / 로그인 / 게스트 플레이</p>
      <div id="authMenu">
        <button id="guestBtn">게스트 플레이</button>
        <button id="showLoginBtn">로그인</button>
        <button id="showSignupBtn">회원가입</button>
      </div>
      <div id="authForm" class="hidden">
        <h2 id="authTitle">로그인</h2>
        <input id="userId" placeholder="아이디: 영어/숫자/_ 3~16자" autocomplete="username" />
        <input id="userPw" placeholder="비밀번호 4글자 이상" type="password" autocomplete="current-password" />
        <button id="authSubmit">확인</button>
        <button id="authBack">뒤로</button>
      </div>
      <div id="authMsg" class="msg"></div>
      <p class="tiny">서버를 쓰려면 코드 위쪽 SERVER_URL을 Worker 주소로 바꿔야 해.</p>
    </div>
  </div>

  <div id="cardScreen" class="screen hidden">
    <div class="panel">
      <h2 id="cardTitle">카드 선택</h2>
      <div class="barBox"><div id="cardGauge" class="barFill"></div></div>
      <div id="cardList"></div>
      <p class="tiny">카드 선택 중에는 시간과 공격이 완전히 멈춤</p>
    </div>
  </div>

  <div id="pauseScreen" class="screen hidden">
    <div class="panel">
      <h2>PAUSE</h2>
      <p id="pauseInfo"></p>
      <button id="resumeBtn">계속하기</button>
      <button id="leaderBtn">TOP 10 새로고침</button>
      <div id="leader">랭킹 불러오기 전</div>
      <button id="codexBtn">보스 도감 보기</button>
      <div id="codex" class="hidden"></div>
      <button id="restartBtn" class="danger">처음부터 다시 시작</button>
      <button id="logoutBtn">타이틀로</button>
    </div>
  </div>
</div>

<script>
'use strict';

/*
  여기에 Cloudflare Worker 주소를 넣어.
  예: const SERVER_URL = "https://ultimate-game-server-7157.계정이름.workers.dev";
*/
const SERVER_URL = "https://YOUR_WORKER_URL.workers.dev";

window.onerror = (msg, src, line, col) => {
  alert("게임 오류: " + msg + "\n" + line + ":" + col);
};

const W = 450;
const H = 900;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const $ = (id) => document.getElementById(id);
const authScreen = $('authScreen');
const cardScreen = $('cardScreen');
const pauseScreen = $('pauseScreen');
const pauseBtn = $('pauseBtn');

function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function rand(a,b){ return a + Math.random() * (b-a); }
function randi(a,b){ return Math.floor(rand(a,b+1)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function dist(a,b,c,d){ return Math.hypot(a-c,b-d); }

function loadJSON(key, fallback){
  try{ return JSON.parse(localStorage.getItem(key)) ?? fallback; }catch{ return fallback; }
}
function saveJSON(key, value){ localStorage.setItem(key, JSON.stringify(value)); }

let globalSave = loadJSON('ultimate_survival_save_v4', null) || {
  best:0,totalPlays:0,totalDeaths:0,totalTime:0,totalCards:0,
  achievements:{}, bosses:{seen:{},clears:{},noHit:{},seenAttacks:{}},
  guestMergeId: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random())
};
function saveLocal(){ saveJSON('ultimate_survival_save_v4', globalSave); }

let auth = {
  type:'guest', id:'GUEST', token:localStorage.getItem('us_token') || '',
  userId:localStorage.getItem('us_user') || ''
};

async function api(path, body={}){
  if(!SERVER_URL || SERVER_URL.includes('YOUR_WORKER_URL')){
    throw new Error('SERVER_URL에 Cloudflare Worker 주소를 넣어야 합니다.');
  }
  const res = await fetch(SERVER_URL + path, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  const data = await res.json().catch(()=>({ok:false,error:'서버 응답 오류'}));
  if(!data.ok) throw new Error(data.error || '서버 오류');
  return data;
}

function mergeSaveFromServer(save){
  if(!save || typeof save !== 'object') return;
  globalSave.best = Math.max(globalSave.best||0, save.best||0);
  if(save.bosses) globalSave.bosses = mergeObj(globalSave.bosses||{}, save.bosses);
  if(save.achievements) globalSave.achievements = mergeObj(globalSave.achievements||{}, save.achievements);
  saveLocal();
}
function mergeObj(a,b){
  const out = {...a};
  for(const k of Object.keys(b||{})){
    if(b[k] && typeof b[k] === 'object' && !Array.isArray(b[k])) out[k] = mergeObj(out[k]||{}, b[k]);
    else if(typeof b[k] === 'number') out[k] = Math.max(Number(out[k]||0), b[k]);
    else out[k] = b[k] || out[k];
  }
  return out;
}
async function submitAccountSave(){
  if(auth.type !== 'account' || !auth.token) return;
  try{ await api('/submit', {token:auth.token, save:globalSave, best:globalSave.best}); }catch(e){ console.warn(e); }
}

let authMode = 'login';
$('guestBtn').onclick = () => startGameAsGuest();
$('showLoginBtn').onclick = () => showAuthForm('login');
$('showSignupBtn').onclick = () => showAuthForm('signup');
$('authBack').onclick = () => {
  $('authForm').classList.add('hidden'); $('authMenu').classList.remove('hidden'); $('authMsg').textContent='';
};
$('authSubmit').onclick = async () => {
  const id = $('userId').value.trim();
  const password = $('userPw').value;
  $('authMsg').textContent = '처리 중...';
  try{
    const data = await api(authMode === 'login' ? '/login' : '/signup', {
      id, password, guest:globalSave, mergeId:globalSave.guestMergeId
    });
    auth = {type:'account', id:data.id, userId:data.id, token:data.token};
    localStorage.setItem('us_token', data.token);
    localStorage.setItem('us_user', data.id);
    mergeSaveFromServer(data.save);
    startGame();
  }catch(e){ $('authMsg').textContent = e.message; }
};
function showAuthForm(mode){
  authMode = mode;
  $('authTitle').textContent = mode === 'login' ? '로그인' : '회원가입';
  $('authSubmit').textContent = mode === 'login' ? '로그인' : '회원가입';
  $('authMenu').classList.add('hidden'); $('authForm').classList.remove('hidden'); $('authMsg').textContent='';
}
function startGameAsGuest(){ auth = {type:'guest', id:'GUEST', token:''}; startGame(); }

const arena = {x:75,y:55,w:300,h:805};
const bossList = [
  {id:'inferno', name:'인페르노', color:'#ff3333', attackColor:'#ff5533', warn:'#ff2200'},
  {id:'storm', name:'스톰', color:'#33ccff', attackColor:'#80e8ff', warn:'#00bfff'},
  {id:'venom', name:'베놈', color:'#66ff66', attackColor:'#7dff4e', warn:'#37ff37'},
  {id:'eclipse', name:'이클립스', color:'#aa66ff', attackColor:'#b177ff', warn:'#8a33ff'},
  {id:'frost', name:'프로스트', color:'#99ffff', attackColor:'#c8ffff', warn:'#66e6ff'},
  {id:'crimson', name:'크림슨', color:'#ff0066', attackColor:'#ff4080', warn:'#ff0055'},
  {id:'gravity', name:'그래비티', color:'#cc99ff', attackColor:'#d3a6ff', warn:'#9f6bff'},
  {id:'origin', name:'오리진', color:'#ffcc33', attackColor:'#8a5a00', warn:'#ffd24d', outline:'#ffffff'},
  {id:'void', name:'보이드', color:'#5555ff', attackColor:'#7777ff', warn:'#3b3bff'},
  {id:'rose', name:'로즈', color:'#ff77aa', attackColor:'#ff8fbd', warn:'#ff4f9a'}
];

let game;
function freshGame(){
  return {
    state:'countdown', countdown:3.2, gameOver:false,
    time:0, sessionPlayTime:0, lastBank:0,
    nextCard:20, cardOpen:false, cardTime:10, cardOptions:[],
    nextBoss:120, boss:null, bossTimer:0, bossIntro:0, bossAttackTimer:4, bossNoHit:true,
    normalTimer:0.8, specialTimer:14,
    player:{x:225,y:760,r:12,maxHp:100,hp:100,shield:0,inv:0},
    target:{x:225,y:760}, keys:{},
    bullets:[], warnings:[], particles:[], texts:[],
    usedCards:new Set(), chosenCards:[],
    stats:{
      normalDmgMul:1, specialDmgMul:1, allDmgMul:1, normalSpeedMul:1,
      specialSpeedMul:1, maxHpBonus:0, revive:0, healPlus:0,
      lowHpNormalReduce:false, specialNoDamageBuff:false,
      bossBlessing:false, bossRebuild:false, timeBuffer:false, noShieldUntil:0
    },
    temps:[], specialCheck:null, lastSpecialDamaged:false,
    bossWeights: loadJSON('ultimate_boss_weights_v1', null) || {}
  };
}

function startGame(){
  authScreen.classList.add('hidden'); pauseScreen.classList.add('hidden'); cardScreen.classList.add('hidden');
  pauseBtn.classList.remove('hidden');
  game = freshGame();
  globalSave.totalPlays = (globalSave.totalPlays||0) + 1;
  saveLocal();
}
function restartGame(){ pauseScreen.classList.add('hidden'); startGame(); }
function unlock(name){ globalSave.achievements[name] = true; }

function normalInterval(){ if(game.time < 60) return 0.8; if(game.time < 110) return 0.75; return 0.55; }
function specialInterval(){ if(game.time < 60) return 14; if(game.time < 110) return 10; return 8; }
function normalSpeed(){ return game.stats.normalSpeedMul * tempMul('normalSlow') * tempMul('cardNormalSlow'); }
function damageMul(source){
  let m = game.stats.allDmgMul;
  m *= tempMul('allDef');
  if(source === 'normal'){
    m *= game.stats.normalDmgMul;
    if(game.stats.lowHpNormalReduce && game.player.hp <= game.player.maxHp * 0.4) m *= 0.9;
    m *= tempMul('normalDef');
  }
  if(source === 'special' || source === 'boss') m *= game.stats.specialDmgMul;
  return m;
}
function tempMul(type){
  return game.temps.filter(t=>t.type===type).reduce((m,t)=>m*t.mul,1);
}
function addTemp(type, time, mul){ game.temps.push({type,time,mul}); }
function updateTemps(dt){
  for(const t of game.temps) t.time -= dt;
  game.temps = game.temps.filter(t=>t.time > 0);
  if(game.specialCheck){
    game.specialCheck.time -= dt;
    if(game.specialCheck.time <= 0){
      if(game.stats.specialNoDamageBuff && !game.specialCheck.damaged){ addTemp('allDef', 6, 0.88); floatText('회피 성공: 방어 +12%', game.player.x, game.player.y-28, '#b86bff'); }
      game.specialCheck = null;
    }
  }
}

function heal(amount){
  const p = game.player;
  p.hp = clamp(p.hp + amount * (1 + game.stats.healPlus), 0, p.maxHp);
}
function changeMaxHp(delta){
  const p = game.player;
  p.maxHp = Math.max(30, p.maxHp + delta);
  p.hp = clamp(p.hp + Math.max(0,delta), 0, p.maxHp);
}
function takeDamage(amount, source='normal'){
  if(game.gameOver) return;
  const p = game.player;
  if(p.inv > 0 && source !== 'wall') return;
  if(source === 'special' && game.specialCheck) game.specialCheck.damaged = true;
  if(source === 'boss') game.bossNoHit = false;
  if(game.boss && source !== 'wall') game.bossNoHit = false;
  amount *= damageMul(source);
  if(p.shield > 0 && source !== 'wall'){
    p.shield--; p.inv = 0.18; floatText('SHIELD', p.x, p.y-22, '#7fffd4'); sfx(660,0.05,'square',0.05); return;
  }
  p.hp -= amount;
  p.inv = source === 'wall' ? 0 : 0.12;
  sfx(120,0.04,'sawtooth',0.05);
  if(p.hp <= 0){
    if(game.stats.revive > 0){
      game.stats.revive--; p.hp = p.maxHp * 0.5; p.shield += 2; p.inv = 1.5; floatText('부활!', p.x, p.y-30, '#ffd85a');
    }else endGame();
  }
}
function endGame(){
  game.gameOver = true; game.state='over';
  globalSave.totalDeaths = (globalSave.totalDeaths||0) + 1;
  globalSave.best = Math.max(globalSave.best||0, Math.floor(game.time));
  globalSave.totalTime = (globalSave.totalTime||0) + Math.floor(game.sessionPlayTime);
  if(game.time >= 600) unlock('SURVIVOR_600');
  saveLocal(); submitAccountSave();
}

function addBullet(b){
  if(game.bullets.length > 650) return;
  game.bullets.push({r:5,dmg:5,color:'#ffd34d',kind:'normal',life:9,shape:'circle',...b});
}
function addRectBullet(b){ addBullet({shape:'rect',life:0.55,dmg:10,...b}); }
function addWarning(w){ game.warnings.push({life:w.life||1.5,max:w.life||1.5,fired:false,color:'#ff3344',...w}); }
function floatText(text,x,y,color='#fff'){ game.texts.push({text,x,y,color,life:1.2,max:1.2}); }
function aimVelocity(x,y,speed){
  const dx=game.player.x-x, dy=game.player.y-y, d=Math.hypot(dx,dy)||1;
  return {vx:dx/d*speed, vy:dy/d*speed};
}
function startSpecialCheck(time=2.5){ game.specialCheck = {time, damaged:false}; }

const normalPatterns = [
  function A1(){ const y=rand(arena.y+40, arena.y+arena.h-40), v=aimVelocity(arena.x-20,y,190*normalSpeed()); addBullet({x:arena.x-20,y,...v,r:5,dmg:5,color:'#ffd34d'}); },
  function A2(){ const y=rand(arena.y+40, arena.y+arena.h-40), v=aimVelocity(arena.x+arena.w+20,y,190*normalSpeed()); addBullet({x:arena.x+arena.w+20,y,...v,r:5,dmg:5,color:'#ffd34d'}); },
  function A3(){ const x=rand(arena.x+15,arena.x+arena.w-15); addBullet({x,y:arena.y-20,vx:rand(-12,12),vy:185*normalSpeed(),r:5}); },
  function A4(){ const x=rand(arena.x+15,arena.x+arena.w-15); addBullet({x,y:arena.y+arena.h+20,vx:rand(-10,10),vy:-170*normalSpeed(),r:5}); },
  function A5(){ const x=rand(arena.x+40,arena.x+arena.w-40); for(let i=-2;i<=2;i++){ const a=Math.PI/2+i*0.16; addBullet({x,y:arena.y-20,vx:Math.cos(a)*150*normalSpeed(),vy:Math.sin(a)*150*normalSpeed(),r:4}); } },
  function A6(){ const gap=randi(0,4); for(let i=0;i<5;i++){ if(i===gap) continue; const x=arena.x+30+i*60; addBullet({x,y:arena.y-20,vx:0,vy:160*normalSpeed(),r:6,color:'#ffe27d'}); } },
  function A7(){ const side=Math.random()<.5?-1:1; const x=side<0?arena.x-18:arena.x+arena.w+18; for(let i=0;i<4;i++){ const y=arena.y+80+i*170; addBullet({x,y,vx:side<0?150*normalSpeed():-150*normalSpeed(),vy:25*normalSpeed(),r:5}); } },
  function A8(){ const x=rand(arena.x+60,arena.x+arena.w-60), y=rand(arena.y+100,arena.y+arena.h-120); for(let i=0;i<10;i++){ const a=i/10*Math.PI*2; addBullet({x,y,vx:Math.cos(a)*105*normalSpeed(),vy:Math.sin(a)*105*normalSpeed(),r:4,color:'#fff0a0'}); } },
  function A9(){ const x=rand(arena.x+20,arena.x+arena.w-20); addWarning({kind:'rect',x:x-10,y:arena.y,w:20,h:arena.h,life:0.9,color:'#ffcc33',fire:()=>addRectBullet({x:x-10,y:arena.y,w:20,h:arena.h,kind:'normal',dmg:6,color:'#ffcc33'})}); },
  function A10(){ for(const x of [arena.x-20,arena.x+arena.w+20]){ const y=rand(arena.y+60,arena.y+arena.h-80), v=aimVelocity(x,y,155*normalSpeed()); addBullet({x,y,...v,r:5,color:'#ffd34d'}); } },
  function A11(){ const gap=randi(0,3); for(let i=0;i<4;i++){ if(i===gap) continue; const x=arena.x+45+i*70; addBullet({x,y:arena.y-18,vx:0,vy:150*normalSpeed(),r:7,color:'#ffe68c'}); } },
  function A12(){ const gap=randi(0,4); for(let i=0;i<5;i++){ if(i===gap || i===gap+1) continue; const y=arena.y+80+i*145; addBullet({x:arena.x-20,y,vx:150*normalSpeed(),vy:0,r:6,color:'#ffd34d'}); } },
  function A13(){ const x=arena.x+arena.w/2, y=arena.y+arena.h/2; const base=game.time*2.4; for(let i=0;i<4;i++){ const a=base+i*Math.PI/2; addBullet({x,y,vx:Math.cos(a)*120*normalSpeed(),vy:Math.sin(a)*120*normalSpeed(),r:4,color:'#fff5b8'}); } },
  function A14(){ const x=rand(arena.x+30,arena.x+arena.w-30); addBullet({x,y:arena.y-20,vx:rand(-25,25)*normalSpeed(),vy:115*normalSpeed(),r:10,dmg:8,color:'#ffe080'}); },
  function A15(){ const safe=randi(0,2); for(let i=0;i<3;i++){ if(i===safe) continue; for(let k=0;k<3;k++){ const x=arena.x+35+i*100+k*18; addBullet({x,y:arena.y-20,vx:0,vy:145*normalSpeed(),r:4,color:'#ffdf73'}); } } }
];

const specialAttacks = [];
function laneLaserVertical(cols, safeCount, color='#ff5060'){
  const safe = new Set(); while(safe.size<safeCount) safe.add(randi(0,cols-1));
  for(let i=0;i<cols;i++) if(!safe.has(i)){
    const x=arena.x+i*arena.w/cols, w=arena.w/cols*.62;
    addWarning({kind:'rect',x:x+w*.3,y:arena.y,w,h:arena.h,life:1.7,color,fire:()=>addRectBullet({x:x+w*.3,y:arena.y,w,h:arena.h,kind:'special',dmg:14,color})});
  }
  startSpecialCheck(2.4);
}
function laneLaserHorizontal(rows, safeCount, color='#ff5060'){
  const safe = new Set(); while(safe.size<safeCount) safe.add(randi(0,rows-1));
  for(let i=0;i<rows;i++) if(!safe.has(i)){
    const y=arena.y+i*arena.h/rows, h=arena.h/rows*.55;
    addWarning({kind:'rect',x:arena.x,y:y+h*.35,w:arena.w,h,life:1.8,color,fire:()=>addRectBullet({x:arena.x,y:y+h*.35,w:arena.w,h,kind:'special',dmg:14,color})});
  }
  startSpecialCheck(2.5);
}
function bomb(x,y,r,color,source='special',life=1.6,dmg=15){
  addWarning({kind:'circle',x,y,r,life,color,fire:()=>{

function setTimeoutSafe(fn, ms){ setTimeout(()=>{ if(game && !game.gameOver && !game.cardOpen) fn(); }, ms); }
function spawnNormal(){ pick(normalPatterns)(); }
function spawnSpecial(){ pick(specialAttacks)(); if(game.stats.specialNoDamageBuff) startSpecialCheck(3); if(game.stats.timeBuffer) addTemp('normalSlow',4,0.85); }

function selectBoss(){
  for(const b of bossList) if(game.bossWeights[b.id] == null) game.bossWeights[b.id] = 100;
  const total = bossList.reduce((s,b)=>s+game.bossWeights[b.id],0);
  let r = Math.random()*total;
  for(const b of bossList){ r -= game.bossWeights[b.id]; if(r <= 0) return b; }
  return bossList[0];
}
function startBoss(){
  const b = selectBoss();
  game.boss = {...b, hp:100, maxHp:100, attacksSeen:{}};
  game.bossIntro = 2.2; game.bossTimer = 25; game.bossAttackTimer = 4; game.bossNoHit = true;
  globalSave.bosses.seen[b.id] = (globalSave.bosses.seen[b.id]||0)+1;
  globalSave.bosses.seenAttacks[b.id] = globalSave.bosses.seenAttacks[b.id] || {};
  if(game.stats.bossBlessing){ heal(game.player.maxHp*0.2); game.player.shield += 1; }
  sfx(80,0.2,'sawtooth',0.08);
  saveLocal();
}
function endBoss(clear=true){
  if(!game.boss) return;
  const id=game.boss.id;
  if(clear){
    globalSave.bosses.clears[id]=(globalSave.bosses.clears[id]||0)+1;
    if(game.bossNoHit) globalSave.bosses.noHit[id]=(globalSave.bosses.noHit[id]||0)+1;
    game.bossWeights[id] = Math.max(30, (game.bossWeights[id]||100)-30);
    for(const b of bossList) if(b.id!==id) game.bossWeights[b.id] = Math.min(150,(game.bossWeights[b.id]||100)+10);
    saveJSON('ultimate_boss_weights_v1', game.bossWeights);
    saveLocal(); submitAccountSave();
    if(game.stats.bossRebuild){ heal(game.player.maxHp*0.2); game.pendingBossRewardBuff = true; }
    openCards(true);
  }
  game.boss = null; game.nextBoss = game.time + 120;
}
function bossAttack(){
  const b=game.boss; if(!b) return;
  const index = Object.keys(globalSave.bosses.seenAttacks[b.id]||{}).length % 10;
  globalSave.bosses.seenAttacks[b.id][String(index+1)] = true;
  const c=b.attackColor, w=b.warn, outline=b.outline;
  if(b.id==='inferno') bossInferno(c,w);
  else if(b.id==='storm') bossStorm(c,w);
  else if(b.id==='venom') bossVenom(c,w);
  else if(b.id==='eclipse') bossEclipse(c,w);
  else if(b.id==='frost') bossFrost(c,w);
  else if(b.id==='crimson') bossCrimson(c,w);
  else if(b.id==='gravity') bossGravity(c,w);
  else if(b.id==='origin') bossOrigin(c,w,outline);
  else if(b.id==='void') bossVoid(c,w);
  else bossRose(c,w);
  saveLocal();
}

  {id:'P5',r:'penalty',name:'보호막 봉인',desc:'15초 동안 보호막 획득 불가',apply:()=>{game.stats.noShieldUntil=game.time+15; game.player.shield=0;}}
];
function rarityName(r){ return {common:'초록',rare:'파랑',epic:'보라',legend:'전설',penalty:'패널티'}[r]||r; }
function rarityClass(r){ return {common:'cCommon',rare:'cRare',epic:'cEpic',legend:'cLegend',penalty:'cPenalty'}[r]||''; }
function positivePool(r){ return cards.filter(c=>c.r===r && !game.usedCards.has(c.id)); }
function removeOnePenalty(){
  const p = game.chosenCards.findIndex(id=>String(id).startsWith('P'));
  if(p>=0){ const id=game.chosenCards.splice(p,1)[0]; floatText(id+' 정화', game.player.x, game.player.y-25, '#55b7ff'); }
  else heal(15);
}
function openCards(bossReward=false){
  if(game.gameOver) return;
  game.cardOpen=true; game.cardTime=10; game.cardOptions=[];
  const remaining = cards.filter(c=>!game.usedCards.has(c.id));
  if(remaining.length===0){ game.usedCards.clear(); heal(game.player.maxHp*0.3); floatText('카드 풀 초기화 + 회복', game.player.x, game.player.y-35, '#56ff81'); }
  if(!bossReward && Math.random()<0.03){
    game.cardOptions=[pick(penalties)];
  }else{
    const rarities = bossReward ? ['rare','epic','legend'] : ['common','rare','epic'];
    while(game.cardOptions.length<3){
      let r;
      if(bossReward){ const roll=Math.random(); r= roll<0.48?'rare':roll<0.86?'epic':'legend'; }
      else { const roll=Math.random(); r= roll<0.65?'common':roll<0.85?'rare':'epic'; }
      let pool=positivePool(r);
      if(pool.length===0) pool=cards.filter(c=>!game.usedCards.has(c.id));
      if(pool.length===0) break;
      const c=pick(pool);
      if(!game.cardOptions.some(x=>x.id===c.id)) game.cardOptions.push(c);
    }
  }
  renderCardScreen(bossReward);
}
function renderCardScreen(bossReward=false){
  $('cardTitle').textContent = bossReward ? '보스 보상 카드' : '카드 선택';
  const list=$('cardList'); list.innerHTML='';
  for(const c of game.cardOptions){
    const btn=document.createElement('button');
    btn.className='cardBtn '+rarityClass(c.r);
    btn.innerHTML=`<b>[${rarityName(c.r)}] ${c.name}</b><br><span>${c.desc}</span>`;
    btn.onclick=()=>chooseCard(c);
    list.appendChild(btn);
  }
  cardScreen.classList.remove('hidden');
}
function chooseCard(c){
  if(c.r==='penalty'){
    c.apply(); game.chosenCards.push(c.id);
  }else{
    c.apply(); game.usedCards.add(c.id); game.chosenCards.push(c.id); globalSave.totalCards=(globalSave.totalCards||0)+1;
  }
  sfx(c.r==='penalty'?90:520,0.08,'triangle',0.06);
  game.cardOpen=false; cardScreen.classList.add('hidden'); if(game.pendingBossRewardBuff){ addTemp('normalDef',5,0.8); game.pendingBossRewardBuff=false; } saveLocal(); submitAccountSave();
}

pauseBtn.onclick=()=>openPause();
$('resumeBtn').onclick=()=>closePause();
$('restartBtn').onclick=()=>restartGame();
$('logoutBtn').onclick=()=>{ pauseScreen.classList.add('hidden'); pauseBtn.classList.add('hidden'); authScreen.classList.remove('hidden'); };
$('leaderBtn').onclick=()=>loadLeader();
$('codexBtn').onclick=()=>{ $('codex').classList.toggle('hidden'); renderCodex(); };
function openPause(){ if(!game||game.gameOver) return; pauseScreen.classList.remove('hidden'); $('pauseInfo').textContent=`TIME ${Math.floor(game.time)}s / BEST ${globalSave.best||0}s / ${auth.type==='account'?auth.id:'GUEST'}`; loadLeader(); }
function closePause(){ pauseScreen.classList.add('hidden'); }
async function loadLeader(){
  const box=$('leader');
  if(SERVER_URL.includes('YOUR_WORKER_URL')){ box.innerHTML='SERVER_URL을 Worker 주소로 바꾸면 TOP 10이 표시됨'; return; }
  box.textContent='불러오는 중...';
  try{
    const data=await api('/top10', {});
    box.innerHTML=(data.rows||[]).map(r=>`${r.rank}. ${r.id} - ${r.best}s`).join('<br>') || '아직 기록 없음';
  }catch(e){ box.textContent=e.message; }
}
function renderCodex(){
  const box=$('codex');
  box.innerHTML=bossList.map(b=>{
    const seen=globalSave.bosses.seen[b.id]||0, clears=globalSave.bosses.clears[b.id]||0, nh=globalSave.bosses.noHit[b.id]||0;
    const attacks=globalSave.bosses.seenAttacks[b.id]||{};
    const attackText=seen?Object.keys(attacks).sort().map(n=>'A'+n).join(', ')||'아직 없음':'???';
    return `<b style="color:${b.color}">${seen?b.name:'???'}</b> / 조우 ${seen} / 클리어 ${clears} / 노히트 ${nh}<br><span class="tiny">본 공격: ${attackText}</span><hr>`;
  }).join('');
}

let audioCtx=null, bgmOsc=null, bgmGain=null;
function getAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function sfx(freq=440,time=0.06,type='sine',vol=0.04){
  try{ const ac=getAudio(), o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.value=freq; g.gain.value=vol; o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+time); }catch{}
}
function startBgm(){
  if(bgmOsc) return;
  try{ const ac=getAudio(); bgmOsc=ac.createOscillator(); bgmGain=ac.createGain(); bgmOsc.type='triangle'; bgmOsc.frequency.value=70; bgmGain.gain.value=0.018; bgmOsc.connect(bgmGain); bgmGain.connect(ac.destination); bgmOsc.start(); }catch{}
}

canvas.addEventListener('pointerdown', e=>{ canvas.setPointerCapture(e.pointerId); setTarget(e); startBgm(); });
canvas.addEventListener('pointermove', e=>{ if(e.pressure>0 || e.buttons) setTarget(e); });
function setTarget(e){
  if(!game) return;
  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left)/rect.width*W, y=(e.clientY-rect.top)/rect.height*H;
  game.target.x=clamp(x, arena.x+game.player.r, arena.x+arena.w-game.player.r);
  game.target.y=clamp(y, arena.y+game.player.r, arena.y+arena.h-game.player.r);
}
window.addEventListener('keydown',e=>{ if(!game)return; game.keys[e.key]=true; if(e.key==='p'||e.key==='P') openPause(); });
window.addEventListener('keyup',e=>{ if(!game)return; game.keys[e.key]=false; });

function updatePlayer(dt){
  const p=game.player; p.inv=Math.max(0,p.inv-dt);
  let dx=0,dy=0;
  if(game.keys.ArrowLeft||game.keys.a) dx--;
  if(game.keys.ArrowRight||game.keys.d) dx++;
  if(game.keys.ArrowUp||game.keys.w) dy--;
  if(game.keys.ArrowDown||game.keys.s) dy++;
  if(dx||dy){ const d=Math.hypot(dx,dy); game.target.x=clamp(p.x+dx/d*260*dt, arena.x+p.r, arena.x+arena.w-p.r); game.target.y=clamp(p.y+dy/d*260*dt, arena.y+p.r, arena.y+arena.h-p.r); }
  const vx=game.target.x-p.x, vy=game.target.y-p.y, d=Math.hypot(vx,vy);
  const step=330*dt;
  if(d>1){ p.x += vx/d*Math.min(step,d); p.y += vy/d*Math.min(step,d); }
  const touchWall = p.x-p.r<=arena.x+1 || p.x+p.r>=arena.x+arena.w-1 || p.y-p.r<=arena.y+1 || p.y+p.r>=arena.y+arena.h-1;
  if(touchWall) takeDamage(5*dt,'wall');
}
function updateBullets(dt){
  for(const b of game.bullets){ b.x += (b.vx||0)*dt; b.y += (b.vy||0)*dt; b.life -= dt; }
  const p=game.player;
  game.bullets = game.bullets.filter(b=>{
    let hit=false;
    if(b.shape==='rect') hit = circleRect(p.x,p.y,p.r,b.x,b.y,b.w,b.h);
    else hit = dist(p.x,p.y,b.x,b.y) < p.r + b.r;
    if(hit){ takeDamage(b.dmg,b.kind); return false; }
    return b.life>0 && b.x>-80 && b.x<W+80 && b.y>-80 && b.y<H+80;
  });
}
function circleRect(cx,cy,cr,rx,ry,rw,rh){ const nx=clamp(cx,rx,rx+rw), ny=clamp(cy,ry,ry+rh); return dist(cx,cy,nx,ny) <= cr; }
function updateWarnings(dt){
  for(const w of game.warnings){
    w.life -= dt;
    if(w.life<=0 && !w.fired){ w.fired=true; if(w.fire) w.fire(); }
  }
  game.warnings = game.warnings.filter(w=>w.life>-0.25);
}
function updateTexts(dt){ for(const t of game.texts){ t.life-=dt; t.y-=25*dt; } game.texts=game.texts.filter(t=>t.life>0); }

function update(dt){
  if(!game) return;
  if(game.state==='countdown'){
    game.countdown -= dt;
    if(game.countdown<=0){ game.state='play'; game.normalTimer=0.2; game.specialTimer=specialInterval(); }
    return;
  }
  if(game.state!=='play' || game.gameOver) return;
  if(!pauseScreen.classList.contains('hidden')) return;
  if(game.cardOpen){
    game.cardTime -= dt;
    $('cardGauge').style.width = `${clamp(game.cardTime/10*100,0,100)}%`;
    if(game.cardTime <= 0){ chooseCard(pick(penalties)); }
    return;
  }

  game.time += dt; game.sessionPlayTime += dt;
  updateTemps(dt); updatePlayer(dt); updateWarnings(dt); updateBullets(dt); updateTexts(dt);

  if(Math.floor(game.time) > game.lastBank){
    game.lastBank = Math.floor(game.time);
    if(game.lastBank % 10 === 0){ globalSave.best=Math.max(globalSave.best||0, Math.floor(game.time)); saveLocal(); }
  }
  if(game.time>=600) unlock('SURVIVOR_600');

  game.normalTimer -= dt;
  while(game.normalTimer<=0){ spawnNormal(); game.normalTimer += normalInterval(); }

  if(!game.boss && game.time >= game.nextBoss) startBoss();
  if(game.boss){
    if(game.bossIntro>0){ game.bossIntro-=dt; return; }
    game.bossTimer -= dt; game.bossAttackTimer -= dt;
    if(game.bossAttackTimer<=0){ bossAttack(); game.bossAttackTimer += 4; }
    if(game.bossTimer<=0) endBoss(true);
  }else{
    game.specialTimer -= dt;
    if(game.specialTimer<=0){ spawnSpecial(); game.specialTimer += specialInterval(); }
  }

  if(!game.boss && game.time >= game.nextCard){ game.nextCard += 20; openCards(false); }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const grd=ctx.createLinearGradient(0,0,0,H); grd.addColorStop(0,'#050816'); grd.addColorStop(1,'#01030a'); ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);
  drawArena();
  if(game){ drawWarnings(); drawBullets(); drawPlayer(); drawUI(); drawTexts(); if(game.state==='countdown') drawCountdown(); if(game.gameOver) drawGameOver(); }
  else drawTitleHint();
}
function drawArena(){
  ctx.save(); ctx.shadowColor='#1ca8ff'; ctx.shadowBlur=16; ctx.strokeStyle='#2bbcff'; ctx.lineWidth=3; ctx.strokeRect(arena.x,arena.y,arena.w,arena.h); ctx.restore();
  ctx.strokeStyle='rgba(60,180,255,.18)'; ctx.lineWidth=1;
  for(let y=arena.y+40;y<arena.y+arena.h;y+=40){ ctx.beginPath(); ctx.moveTo(arena.x,y); ctx.lineTo(arena.x+arena.w,y); ctx.stroke(); }
}
function drawWarnings(){
  for(const w of game.warnings){
    ctx.save(); ctx.globalAlpha=0.28+0.25*Math.sin(Date.now()/80); ctx.strokeStyle=w.color; ctx.fillStyle=w.color; ctx.lineWidth=3;
    if(w.kind==='rect'){ ctx.fillRect(w.x,w.y,w.w,w.h); ctx.strokeRect(w.x,w.y,w.w,w.h); }
    else if(w.kind==='circle'){ ctx.beginPath(); ctx.arc(w.x,w.y,w.r,0,Math.PI*2); ctx.fill(); ctx.stroke(); }
    else if(w.kind==='line'){ ctx.beginPath(); ctx.moveTo(w.x1,w.y1); ctx.lineTo(w.x2,w.y2); ctx.stroke(); }
    ctx.restore();
  }
}
function drawBullets(){
  for(const b of game.bullets){
    ctx.save(); ctx.shadowColor=b.color; ctx.shadowBlur=10; ctx.fillStyle=b.color;
    if(b.shape==='rect'){ ctx.globalAlpha=.72; ctx.fillRect(b.x,b.y,b.w,b.h); }
    else{ ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill(); if(b.outline){ ctx.shadowBlur=0; ctx.strokeStyle=b.outline; ctx.lineWidth=2; ctx.stroke(); } }
    ctx.restore();
  }
}
function drawPlayer(){
  const p=game.player; ctx.save(); ctx.globalAlpha=p.inv>0?0.55+0.45*Math.sin(Date.now()/35):1; ctx.shadowColor='#fff'; ctx.shadowBlur=12; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); ctx.restore();
  if(p.shield>0){ ctx.save(); ctx.strokeStyle='#7fffd4'; ctx.shadowColor='#7fffd4'; ctx.shadowBlur=12; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(p.x,p.y,p.r+7,0,Math.PI*2); ctx.stroke(); ctx.fillStyle='#7fffd4'; ctx.font='12px Arial'; ctx.textAlign='center'; ctx.fillText('x'+p.shield,p.x,p.y-18); ctx.restore(); }
}
function drawUI(){
  const p=game.player;
  ctx.fillStyle='#dff7ff'; ctx.font='bold 18px Arial'; ctx.textAlign='left'; ctx.fillText(`TIME ${Math.floor(game.time)}s`,18,28);
  ctx.textAlign='center'; ctx.fillText(auth.type==='account'?auth.id:'GUEST',225,28);
  ctx.textAlign='right'; ctx.fillText(`BEST ${globalSave.best||0}s`,432,28);
  ctx.fillStyle='#222'; ctx.fillRect(18,38,220,12); ctx.fillStyle=p.hp/p.maxHp>.35?'#40ff80':'#ff4060'; ctx.fillRect(18,38,220*clamp(p.hp/p.maxHp,0,1),12); ctx.strokeStyle='#fff'; ctx.strokeRect(18,38,220,12);
  ctx.fillStyle='#fff'; ctx.font='12px Arial'; ctx.textAlign='left'; ctx.fillText(`HP ${Math.ceil(p.hp)}/${Math.ceil(p.maxHp)}  SHIELD ${p.shield}`,18,66);
  ctx.textAlign='right'; ctx.fillText(`CARD ${Math.max(0,Math.ceil(game.nextCard-game.time))}s`,432,66);
  if(game.boss){
    ctx.textAlign='center'; ctx.fillStyle=game.boss.color; ctx.font='bold 22px Arial'; ctx.fillText(game.boss.name,225,92);
    ctx.fillStyle='#222'; ctx.fillRect(105,102,240,10); ctx.fillStyle=game.boss.color; ctx.fillRect(105,102,240*clamp(game.bossTimer/25,0,1),10); ctx.strokeStyle='#fff'; ctx.strokeRect(105,102,240,10);
    if(game.bossIntro>0){ ctx.font='bold 36px Arial'; ctx.fillStyle='#ff5577'; ctx.fillText('BOSS WARNING',225,170); }
  }
}
function drawTexts(){
  for(const t of game.texts){ ctx.save(); ctx.globalAlpha=clamp(t.life/t.max,0,1); ctx.fillStyle=t.color; ctx.font='bold 16px Arial'; ctx.textAlign='center'; ctx.fillText(t.text,t.x,t.y); ctx.restore(); }
}
function drawCountdown(){
  ctx.save(); ctx.fillStyle='rgba(0,0,0,.42)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center'; ctx.fillStyle='#9fe9ff'; ctx.shadowColor='#20c0ff'; ctx.shadowBlur=18; ctx.font='bold 80px Arial'; const n=Math.ceil(game.countdown); ctx.fillText(n>0?n:'START',225,430); ctx.restore();
}
function drawGameOver(){
  ctx.save(); ctx.fillStyle='rgba(0,0,0,.72)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center'; ctx.fillStyle='#ff5577'; ctx.font='bold 48px Arial'; ctx.fillText('GAME OVER',225,360); ctx.fillStyle='#fff'; ctx.font='22px Arial'; ctx.fillText(`TIME ${Math.floor(game.time)}s`,225,410); ctx.fillText(`BEST ${globalSave.best||0}s`,225,445); ctx.font='16px Arial'; ctx.fillText('화면을 누르면 다시 시작',225,500); ctx.restore();
}
function drawTitleHint(){ ctx.fillStyle='#9fe9ff'; ctx.font='bold 28px Arial'; ctx.textAlign='center'; ctx.fillText('ULTIMATE SURVIVAL',225,430); }
canvas.addEventListener('click',()=>{ if(game && game.gameOver) restartGame(); });

let last=performance.now();
function loop(t){
  const dt=Math.min(0.033,(t-last)/1000); last=t;
  update(dt); draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
