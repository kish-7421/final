function playTone(freq,startTime,duration,type,volume){
  const ac=getAudio();if(!ac)return;
  const osc=ac.createOscillator(),gain=ac.createGain();
  const safeVol=Math.max(.001,Math.min(.22,volume||.001));
  osc.type=type||"sine";
  osc.frequency.setValueAtTime(freq,startTime);
  const attack=.012,release=Math.max(.045,duration-attack);
  gain.gain.setValueAtTime(.001,startTime);
  gain.gain.linearRampToValueAtTime(safeVol,startTime+attack);
  gain.gain.exponentialRampToValueAtTime(.001,startTime+attack+release);
  osc.connect(gain);
  gain.connect(ac.destination);
  osc.start(startTime);
  osc.stop(startTime+duration+.04);
}

}

 let safePaths=0,minClear=999;
 const dirs=[[0,0],[1,0],[-1,0],[0,1],[0,-1],[.707,.707],[-.707,.707],[.707,-.707],[-.707,-.707],[input.dx,input.dy]].slice(0,samples);
 for(const [dx,dy] of dirs){
   let pathSafe=true,pathClear=999;
   for(const t of horizons){
     const tx=clamp(player.x+dx*player.speed*t,left()+player.r,right()-player.r);
     const ty=clamp(player.y+dy*player.speed*t,topY()+player.r,bottom()-player.r);
     for(const b of bullets){
       const p=predictBulletPosition(b,t);
       const clear=Math.hypot(tx-p.x,ty-p.y)-(player.r+b.r+5);
       pathClear=Math.min(pathClear,clear);
       if(clear<0){pathSafe=false;break}
     }
     if(!pathSafe)break
   }
   if(pathSafe)safePaths++;
   minClear=Math.min(minClear,pathClear)
 }
 return {safePaths,minClear}
}
function patternMeta(index){
 const m=[
  {pressure:"vertical",density:.45,close:false},{pressure:"horizontal",density:.48,close:false},
  {pressure:"aim",density:.42,close:true},{pressure:"radial",density:.50,close:true},
  {pressure:"radial",density:.68,close:true},{pressure:"vertical",density:.55,close:false},
  {pressure:"corner",density:.46,close:false},{pressure:"orbit",density:.58,close:true},
  {pressure:"horizontal",density:.62,close:false},{pressure:"corner",density:.58,close:true},
  {pressure:"horizontal",density:.66,close:false},{pressure:"vertical",density:.66,close:false},
  {pressure:"orbit",density:.72,close:true}
 ];
 return m[index]||m[index%10]
}
function scoreBossNormal(index){
 const t0=performance.now(),meta=patternMeta(index),skill=estimatePlayerSkill();
 let score=Math.random()*1.4;
 const wall=Math.min(player.x-left(),right()-player.x,player.y-topY(),bottom()-player.y);
 const density=zoneDensity(player.x,player.y,135,null);
 const safety=candidateEscapeSafety(index);
 if(game.bossRecentNormals.includes(index))score-=3.2;
 if(game.bossLastNormal===index)score-=5.5;
 if(wall<55&&meta.close)score-=2.4;
 if(density>18&&meta.density>.6)score-=2.6;
 if(safety.safePaths===0)score-=9;
 else if(safety.safePaths===1)score-=2.2;
 else if(safety.safePaths>=4)score+=.5;
 // Keep challenge proportional to recent performance without obvious rubber-banding.
 const desired=.38+skill*.38;
 score-=Math.abs(meta.density-desired)*2.2;
 if(game.hp/game.maxHp<.25&&meta.density>.65)score-=1.4;
 if(game.shield>0&&meta.density>.58)score+=.25;
 if(game.currentBoss.id==="storm"&&index>=10)score+=.9;
 if(game.currentBoss.id==="rose"&&index>=9)score+=.55;
 const last=game.aiHistory[game.aiHistory.length-1];
 if(last&&last.pressure===meta.pressure)score-=1.0;
 game.aiLastCost=performance.now()-t0;
 return Number.isFinite(score)?score:0
}
function chooseBossNormalAI(){
 const start=performance.now();
 try{
   const source=game.bossNormalBag.length?[...game.bossNormalBag]:[...game.bossNormalPool];
   const maxCandidates=globalSave.lowMode?4:Math.min(5,source.length);
   const rough=source.map(i=>({i,s:Math.random()-(game.bossRecentNormals.includes(i)?1.8:0)})).sort((a,b)=>b.s-a.s).slice(0,maxCandidates);
   let ranked=rough.map(o=>({i:o.i,s:scoreBossNormal(o.i)})).sort((a,b)=>b.s-a.s);
   if(performance.now()-start>4){
     ranked=rough;
   }
   const top=ranked.slice(0,Math.min(3,ranked.length));
   const weights=top.map((x,j)=>Math.max(.1,1.8-j*.55));
   let roll=Math.random()*weights.reduce((a,b)=>a+b,0),pick=top[0].i;
   for(let j=0;j<top.length;j++){roll-=weights[j];if(roll<=0){pick=top[j].i;break}}
   const idx=game.bossNormalBag.indexOf(pick);if(idx>=0)game.bossNormalBag.splice(idx,1);
   const meta=patternMeta(pick);game.aiHistory.push({t:game.time,index:pick,pressure:meta.pressure});
   if(game.aiHistory.length>12)game.aiHistory.shift();
   game.aiLastCost=performance.now()-start;
   return pick
 }catch(e){
   console.warn("boss AI fallback",e);
   return game.bossNormalBag.pop()??game.bossNormalPool[0]??0
 }
}
function shouldUsePattern(index){
 const s=candidateEscapeSafety(index);
 return s.safePaths>0
}
function naturalSafetyAdjust(index){
 if(shouldUsePattern(index))return index;
 const ranked=game.bossNormalPool.filter(i=>i!==index).map(i=>({i,s:scoreBossNormal(i)})).sort((a,b)=>b.s-a.s);
 return ranked.length?ranked[0].i:index
}
function naturalSafetyAngle(base,count){
 const samples=12;let best=base,bestScore=1e9;
 for(let i=0;i<samples;i++){
   const a=base+(i-samples/2)*.08;
   const tx=player.x+Math.cos(a)*70,ty=player.y+Math.sin(a)*70;
   const s=zoneDensity(tx,ty,62);
   if(s<bestScore){bestScore=s;best=a}
 }
 return best
}

function signatureBullet(b,x,y,a,s,r=8,mul=1,extra={}){
 const t=bossTraits[b.id];createBullet({x,y,vx:Math.cos(a)*s*t.speed,vy:Math.sin(a)*s*t.speed,r:r*t.size,damage:currentSpecialDamage()*mul*t.damage,type:"special",color:b.attackColor,bossAttack:true,bossEffect:t.effect,ignoreShield:b.id==="origin",teleport:b.id==="void",...extra})
}
function runBossSignatureSpecial(b,key){
 const i=(Number(key.split("_sp")[1])||1)-1;
 if(b.id==="inferno")return specialInferno(i,b);
 if(b.id==="storm")return specialStorm(i,b);
 if(b.id==="venom")return specialVenom(i,b);
 if(b.id==="eclipse")return specialEclipse(i,b);
 if(b.id==="frost")return specialFrost(i,b);
 if(b.id==="crimson")return specialCrimson(i,b);
 if(b.id==="gravity")return specialGravity(i,b);
 if(b.id==="origin")return specialOrigin(i,b);
 if(b.id==="void")return specialVoid(i,b);
 return specialRose(i,b)
}

function drawBackground(){

  ctx.lineWidth=1;

  for(let i=0;i<5;i++){
    const x=(i*105-t*(9+level))%(W+140)-70;

  if(level>=3&&!boss){
    ctx.globalAlpha=.035+level*.005;
    for(let r=90;r<560;r+=110){

function alphaColor(color,a){
  if(!color)return "rgba(255,0,0,"+a+")";
  if(color[0]==="#"){
    let h=color.slice(1);if(h.length===3)h=h.split("").map(v=>v+v).join("");
    const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
    return "rgba("+r+","+g+","+b+","+a+")";
  }
  return color;
}

      ctx.textAlign="center";
      ctx.fillText("SAFE",w.x,w.y+6);
      ctx.restore();
    }


    if(w.type==="edgeIn"||w.type==="edgeCollapse"){
      ctx.shadowColor="#ff3333";
      ctx.strokeStyle="#ff3333";
      ctx.lineWidth=4;
      ctx.strokeRect(left(),topY(),arena.w,arena.h);
      ctx.lineWidth=2;
      ctx.strokeStyle="#ff9999";
      ctx.strokeRect(left()+12,topY()+12,arena.w-24,arena.h-24);
      ctx.restore();
      continue;
    }


    const wc=w.color||"#ff3333";
    ctx.shadowColor=w.type==="blackhole"?wc:w.type==="dangerSafe"?"#00ff99":w.type==="goldCross"?"#FFD700":wc;
    ctx.strokeStyle=w.type==="blackhole"?wc:w.type==="dangerSafe"?"#00ff99":w.type==="goldCross"?"#FFD700":wc;
    ctx.lineWidth=3;


    if(["circle","doubleCircle","meteor","dangerSafe","blackhole","missile","smallBoom","circleArrow","bossRune","bossComet","bossPetal","bossShard","bossOrbit"].includes(w.type)){
      ctx.beginPath();
      ctx.arc(w.x,w.y,w.r,0,Math.PI*2);
      ctx.stroke();


      // 겹치는 원 장식은 보스 궤도/이중원에서만 살짝 유지
      if(w.type==="doubleCircle"||w.type==="bossOrbit"){
        ctx.globalAlpha=alpha*.75;
        ctx.beginPath();
        ctx.arc(w.x,w.y,w.r+28,0,Math.PI*2);
        ctx.stroke();
        ctx.globalAlpha=alpha;
      }


      // 회전 화살표 장식은 선명하지만 짧게
      if(w.type==="circleArrow"||w.type==="bossRune"){
        ctx.globalAlpha=alpha*.8;
        ctx.beginPath();
        ctx.arc(w.x,w.y,w.r+12,.25+ratio*2.2,.95+ratio*2.2);
        ctx.stroke();
        ctx.globalAlpha=alpha;
      }


      // 꽃/파편 장식은 너무 덮지 않게 개수와 진하기만 살짝 감소
      if(w.type==="bossPetal"){
        ctx.globalAlpha=alpha*.65;
        for(let i=0;i<5;i++){
          const a=Math.PI*2*i/5+ratio*.7;
          ctx.beginPath();
          ctx.ellipse(w.x+Math.cos(a)*w.r*.4,w.y+Math.sin(a)*w.r*.4,w.r*.16,w.r*.3,a,0,Math.PI*2);
          ctx.stroke();
        }
        ctx.globalAlpha=alpha;
      }


      if(w.type==="bossShard"){
        ctx.globalAlpha=alpha*.65;
        for(let i=0;i<5;i++){
          const a=Math.PI*2*i/5;
          ctx.beginPath();
          ctx.moveTo(w.x,w.y);
          ctx.lineTo(w.x+Math.cos(a)*w.r,w.y+Math.sin(a)*w.r);
          ctx.stroke();
        }
        ctx.globalAlpha=alpha;
      }


      if(w.type==="missile"){
        ctx.globalAlpha=alpha*.72;
        for(let i=0;i<4;i++){
          const a=Math.PI*2/4*i;
          ctx.beginPath();
          ctx.arc(w.x+Math.cos(a)*w.r,w.y+Math.sin(a)*w.r,5,0,Math.PI*2);
          ctx.stroke();
        }
        ctx.globalAlpha=alpha;
      }
    }


    if(w.type==="rect"||w.type==="bossPillar"||w.type==="bossGate"||w.type==="bossVine"){
      // 면 채우기는 너무 화면을 가리니까 살짝만 줄이고, 테두리는 선명하게 유지
      const flash=.06+Math.sin(performance.now()/120)*.012;
      ctx.fillStyle=alphaColor(wc,flash);
      ctx.fillRect(w.x,w.y,w.w,w.h);
      ctx.strokeStyle=wc;
      ctx.lineWidth=w.type==="bossGate"?4:3;
      ctx.strokeRect(w.x,w.y,w.w,w.h);


      if(w.type==="bossVine"){
        ctx.globalAlpha=alpha*.65;
        ctx.beginPath();
        for(let i=0;i<3;i++){
          const yy=w.y+i*w.h/2;
          ctx.moveTo(w.x,yy);
          ctx.lineTo(w.x+w.w,yy+Math.sin(i+ratio*2)*6);
        }
        ctx.stroke();
        ctx.globalAlpha=alpha;
      }
    }


    if(w.type==="rectBlast"){
      ctx.fillStyle=alphaColor(wc,.12);
      ctx.fillRect(w.x,w.y,w.w,w.h);
      ctx.shadowColor=wc;
      ctx.shadowBlur=7;
      ctx.strokeStyle=wc;
      ctx.lineWidth=4;
      ctx.strokeRect(w.x,w.y,w.w,w.h);
    }


    if(["line","trackingLine"].includes(w.type)){
      ctx.beginPath();
      ctx.moveTo(w.x-Math.cos(w.a)*600,w.y-Math.sin(w.a)*600);
      ctx.lineTo(w.x+Math.cos(w.a)*600,w.y+Math.sin(w.a)*600);
      ctx.stroke();
    }


    if(w.type==="aimLine"){
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(w.x,w.y);
      ctx.lineTo(w.tx,w.ty);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(w.tx,w.ty,10+ratio*4,0,Math.PI*2);
      ctx.stroke();
    }


    if(w.type==="fan"){
      // 부채꼴은 흐리게 하지 말고, 채움만 살짝 줄이고 테두리는 확실하게
      ctx.save();
      ctx.globalAlpha=alpha*.22;
      ctx.fillStyle=wc;
      ctx.beginPath();
      ctx.moveTo(w.x,w.y);
      ctx.arc(w.x,w.y,w.range,w.a-w.spread/2,w.a+w.spread/2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();


      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(w.x,w.y);
      ctx.arc(w.x,w.y,w.range,w.a-w.spread/2,w.a+w.spread/2);
      ctx.closePath();
      ctx.stroke();
    }


    if(w.type==="ringGap"||w.type==="radialGap"){
      const cnt=w.count||24,range=w.r||560;
      ctx.lineWidth=2.5;
      ctx.globalAlpha=alpha*.68;
      for(let i=0;i<cnt;i++){
        const a=Math.PI*2*i/cnt;
        if(angleDiff(a,w.gap)<w.skipWidth)continue;
        ctx.beginPath();
        ctx.moveTo(w.x+Math.cos(a)*18,w.y+Math.sin(a)*18);
        ctx.lineTo(w.x+Math.cos(a)*range,w.y+Math.sin(a)*range);
        ctx.stroke();
      }


      // 점선 보조원은 장식이라 약하게
      ctx.globalAlpha=alpha*.38;
      ctx.setLineDash([7,10]);
      ctx.beginPath();
      ctx.arc(w.x,w.y,Math.min(80,range*.16),w.gap+w.skipWidth,w.gap-w.skipWidth+Math.PI*2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha=alpha;
    }


    if(w.type==="rotLaser"){
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(w.x-Math.cos(w.a)*600,w.y-Math.sin(w.a)*600);
      ctx.lineTo(w.x+Math.cos(w.a)*600,w.y+Math.sin(w.a)*600);
      ctx.moveTo(w.x-Math.cos(w.a+Math.PI/2)*600,w.y-Math.sin(w.a+Math.PI/2)*600);
      ctx.lineTo(w.x+Math.cos(w.a+Math.PI/2)*600,w.y+Math.sin(w.a+Math.PI/2)*600);
      ctx.stroke();
    }


    if(["cross","eight","goldCross"].includes(w.type)){
      ctx.lineWidth=w.type==="goldCross"?5:3;
      ctx.beginPath();
      ctx.moveTo(w.x-600,w.y);
      ctx.lineTo(w.x+600,w.y);
      ctx.moveTo(w.x,w.y-600);
      ctx.lineTo(w.x,w.y+600);
      if(w.type==="eight"){
        ctx.globalAlpha=alpha*.75;
        ctx.moveTo(w.x-600,w.y-600);
        ctx.lineTo(w.x+600,w.y+600);
        ctx.moveTo(w.x-600,w.y+600);
        ctx.lineTo(w.x+600,w.y-600);
      }
      ctx.stroke();
    }


    ctx.restore();
  }
}

function wrapTextLines(text,maxChars=28){
 const raw=String(text||"").split("\n"),out=[];
 for(const line of raw){let cur="";for(const word of line.split(" ")){if((cur+" "+word).trim().length>maxChars){if(cur)out.push(cur);cur=word}else cur=(cur+" "+word).trim()}if(cur)out.push(cur)}
 return out
}

function drawSurvivor(){
  if(!game.survivorOpen)return;
  const t=game.survivorTimer,p=Math.min(1,t/3),pulse=1+Math.sin(t*9)*.035;
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,0.66)";
  ctx.fillRect(0,0,W,H);


  const g=ctx.createRadialGradient(W/2,H/2,20,W/2,H/2,360);
  g.addColorStop(0,"rgba(255,245,170,.34)");
  g.addColorStop(.35,"rgba(255,215,0,.16)");
  g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);


  ctx.translate(W/2,H/2);
  for(let i=0;i<18;i++){
    const a=t*1.6+i*Math.PI*2/18;
    ctx.save();
    ctx.rotate(a);
    ctx.globalAlpha=(1-p)*.33+.12;
    ctx.fillStyle=i%2?"rgba(255,255,255,.55)":"rgba(255,215,0,.65)";
    ctx.beginPath();
    ctx.moveTo(0,-12);
    ctx.lineTo(12,-250);
    ctx.lineTo(-12,-250);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }


  for(let i=0;i<5;i++){
    ctx.save();
    ctx.globalAlpha=Math.max(0,1-t/3.2)*(.85-i*.1);
    ctx.strokeStyle=i%2?"#ffffff":"#FFD700";
    ctx.shadowColor="#FFD700";
    ctx.shadowBlur=28;
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(0,0,70+t*150+i*34,0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }


  ctx.save();
  ctx.rotate(-t*.8);
  ctx.strokeStyle="#fff7b0";
  ctx.shadowColor="#FFD700";
  ctx.shadowBlur=30;
  ctx.lineWidth=4;
  for(let i=0;i<8;i++){
    const a=i*Math.PI*2/8;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*78,Math.sin(a)*78);
    ctx.lineTo(Math.cos(a)*112,Math.sin(a)*112);
    ctx.stroke();
  }
  ctx.restore();


  const scale=(.72+.28*Math.min(1,t*2))*pulse;
  ctx.scale(scale,scale);
  ctx.textAlign="center";
  ctx.shadowColor="#FFD700";
  ctx.shadowBlur=45;
  ctx.fillStyle="#ffffff";
  ctx.font="bold 66px Arial";
  ctx.fillText("SURVIVOR",0,-26);
  ctx.shadowBlur=22;
  ctx.fillStyle="#FFD700";
  ctx.font="bold 30px Arial";
  ctx.fillText("외형 해금",0,36);
  ctx.font="18px Arial";
  ctx.fillStyle="#fff4aa";
  ctx.fillText("10분 생존 달성",0,72);
